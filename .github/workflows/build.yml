name: Patch Catdrive Ultimate Fix

on: [push, workflow_dispatch]

jobs:
  patch-firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Verify Files
        run: |
          if [ ! -f "623.8.1.bin" ]; then echo "Error: 623.8.1.bin missing"; exit 1; fi
          if [ ! -f "hybrid_custom_mac_sn.bin" ]; then echo "Error: hybrid_custom_mac_sn.bin missing"; exit 1; fi
          echo "Files verified. Starting surgery..."

      - name: Run Ultimate Patch Script
        run: |
          python3 -c "
          import struct
          import zlib
          import sys

          # --- 文件配置 ---
          SRC_BIN = '623.8.1.bin'       # 提供逻辑的供体
          DST_BIN = 'hybrid_custom_mac_sn.bin' # 接受移植的受体
          OUT_BIN = 'hybrid_ultimate_fix.bin'  # 最终产物
          
          # Hybrid 固件的标准 Env 参数
          DST_ENV_OFFSET = 0xD0000
          DST_ENV_SIZE = 0x10000 # 64KB

          # --- 核心移植数据 (硬编码自 623 分析结果) ---
          
          # 1. preboot: 针对 0x46 的探测与断电修复
          # 这是从 623 中提取的原始逻辑
          PAYLOAD_PREBOOT = b'i2c dev 0; i2c probe 46; if test $? = 0; then echo FOUND_0x46; i2c mw 0x46 0x34 0; fi'

          # 2. bootcmd 补丁: 启动内核前的 I2C 初始化序列
          # 这一串指令来自 623 的 bootcmd，必须插在 booti 之前
          PAYLOAD_I2C_INIT = b'i2c mw 0x45 0x33 0x72; i2c mw 0x45 0x3d 0x66; i2c mw 0x45 0x3e 0x66; i2c mw 0x45 0x34 0x00; i2c mw 0x45 0x36 0xff; '

          # --- 工具函数 ---
          def extract_env_vars(data, offset, size):
              # 跳过前4字节CRC
              raw_env = data[offset+4 : offset+size]
              vars_dict = {}
              current_str = b''
              for byte in raw_env:
                  if byte == 0:
                      if not current_str: break
                      if b'=' in current_str:
                          key, val = current_str.split(b'=', 1)
                          vars_dict[key] = val
                      current_str = b''
                  else:
                      current_str += bytes([byte])
              return vars_dict

          # --- 主程序 ---
          print(f'Reading Target: {DST_BIN}')
          with open(DST_BIN, 'rb') as f:
              dst_data = bytearray(f.read())

          # 1. 解析目标环境变量
          print('Parsing environment variables...')
          dst_vars = extract_env_vars(dst_data, DST_ENV_OFFSET, DST_ENV_SIZE)

          # 2. 移植 preboot
          print(f'Injecting preboot logic...')
          dst_vars[b'preboot'] = PAYLOAD_PREBOOT

          # 3. 移植 bootcmd 中的 I2C 初始化
          if b'bootcmd' in dst_vars:
              orig_cmd = dst_vars[b'bootcmd']
              print(f'Original bootcmd: {orig_cmd}')
              
              # 关键逻辑: 在 'booti' 命令之前插入 I2C 初始化
              if b'booti' in orig_cmd:
                  parts = orig_cmd.split(b'booti')
                  # 拼接: [前半部分] + [I2C补丁] + booti + [后半部分]
                  new_cmd = parts[0] + PAYLOAD_I2C_INIT + b'booti' + parts[1]
                  print(f'Patched bootcmd: {new_cmd}')
                  dst_vars[b'bootcmd'] = new_cmd
              else:
                  print('WARNING: booti not found in bootcmd! Appending logic to start.')
                  dst_vars[b'bootcmd'] = PAYLOAD_I2C_INIT + orig_cmd
          else:
              print('ERROR: bootcmd not found in target binary!')
              sys.exit(1)

          # 4. 重新打包
          print('Repacking environment block...')
          new_env_list = []
          for k, v in dst_vars.items():
              new_env_list.append(k + b'=' + v)
          
          # 连接所有变量，结尾补双 null
          new_env_data = b'\0'.join(new_env_list) + b'\0\0'
          
          # 填充 0x00 至 64KB
          padding_len = (DST_ENV_SIZE - 4) - len(new_env_data)
          if padding_len < 0:
              print(f'ERROR: Environment size overflow! Exceeded by {abs(padding_len)} bytes.')
              sys.exit(1)
          
          final_payload = new_env_data + (b'\0' * padding_len)

          # 5. 计算并写入 CRC32 (防止变砖)
          new_crc = zlib.crc32(final_payload) & 0xffffffff
          print(f'New CRC32: {hex(new_crc)}')

          # 写入文件
          dst_data[DST_ENV_OFFSET : DST_ENV_OFFSET+4] = struct.pack('<I', new_crc)
          dst_data[DST_ENV_OFFSET+4 : DST_ENV_OFFSET+DST_ENV_SIZE] = final_payload

          with open(OUT_BIN, 'wb') as f:
              f.write(dst_data)
          print(f'SUCCESS: Generated {OUT_BIN}')
          "

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hybrid_ultimate_fix
          path: hybrid_ultimate_fix.bin
