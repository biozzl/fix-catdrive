name: CatDrive Identity Factory (Deep Clean)

on:
  workflow_dispatch:
    inputs:
      mac_address:
        description: '输入目标 MAC 地址 (例如 00:11:32:12:34:56)'
        required: true
        default: '00:11:32:XX:XX:XX'
      sn_number:
        description: '输入目标 SN 序列号 (自动大写)'
        required: false
        default: ''

jobs:
  inject-identity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Verify Base Firmware
        run: |
          if [ ! -f "hybrid_ultimate_fix_safe.bin" ]; then
            echo "❌ 错误: 仓库根目录下找不到底包 hybrid_ultimate_fix_safe.bin"
            exit 1
          fi
          echo "✅ 底包就绪，准备生产..."

      - name: Run Injection Script
        id: run_script  # 关键ID，确保Artifact上传正常
        env:
          INPUT_MAC: ${{ github.event.inputs.mac_address }}
          INPUT_SN: ${{ github.event.inputs.sn_number }}
        run: |
          python3 -c "
          import struct
          import zlib
          import sys
          import os

          # --- 核心配置 ---
          BASE_BIN = 'hybrid_ultimate_fix_safe.bin'
          
          # 文件名生成逻辑
          mac_input = os.environ.get('INPUT_MAC', '').strip().replace(':', '')
          mac_suffix = mac_input[-4:] if len(mac_input) >=4 else 'xxxx'
          OUT_BIN = f'catdrive_patch_{mac_suffix}.bin'
          
          # 内存布局常量 (绝对不能错)
          ENV_OFFSET = 0xD0000
          ENV_SIZE = 0x5000        # 20KB (严格限制)
          KERNEL_OFFSET = 0xD5000  # 内核绝对起始位置
          
          # 隐藏 SN 的位置 (基于 hybrid_custom_mac_sn.bin 扫描结果)
          HIDDEN_SN_OFFSET = 0x7eb020
          
          # 获取输入并转大写
          target_mac = os.environ.get('INPUT_MAC', '').strip().upper()
          target_sn = os.environ.get('INPUT_SN', '').strip().upper()

          print(f'🏭 启动固件生产线...')
          print(f'   底包: {BASE_BIN}')
          print(f'   目标 MAC: {target_mac}')
          print(f'   目标 SN : {target_sn}')

          # 1. 读取底包
          with open(BASE_BIN, 'rb') as f:
              data = bytearray(f.read())

          # --- 安全检查 1: 底包完整性 ---
          if len(data) != 8388608:
              print('❌ 致命错误: 底包大小不是 8MB！停止操作。')
              sys.exit(1)

          # --- 步骤 2: 清理隐藏的旧 SN ---
          print(f'🧹 正在检查隐藏区域 ({hex(HIDDEN_SN_OFFSET)})...')
          # 读取该位置的前3个字节
          signature = data[HIDDEN_SN_OFFSET:HIDDEN_SN_OFFSET+3]
          
          if signature == b'SN=' or signature == b'sn=':
              # 找到特征码，执行擦除 (擦除16字节，足够覆盖 1910Q2N321313)
              for i in range(16):
                  data[HIDDEN_SN_OFFSET + i] = 0
              print('   ✅ 发现旧 SN，已执行物理擦除 (Zero-out)。')
          else:
              print(f'   ⚠️ 未发现旧 SN 特征码 (Found: {signature})，跳过擦除以策安全。')

          # --- 步骤 3: 注入新身份到标准 Env ---
          print('💉 正在注入新身份到 U-Boot 环境变量...')
          raw_env = data[ENV_OFFSET+4 : ENV_OFFSET+ENV_SIZE]
          
          env_dict = {}
          current_str = b''
          for byte in raw_env:
              if byte == 0:
                  if not current_str: break
                  if b'=' in current_str:
                      k, v = current_str.split(b'=', 1)
                      env_dict[k] = v
                  current_str = b''
              else:
                  current_str += bytes([byte])

          # 强制写入变量
          env_dict[b'ethaddr'] = target_mac.encode('utf-8')
          
          if target_sn:
              env_dict[b'sn'] = target_sn.encode('utf-8')
              env_dict[b'serialnet'] = target_sn.encode('utf-8')

          # 重组数据
          new_env_list = []
          for k, v in env_dict.items():
              new_env_list.append(k + b'=' + v)
          
          new_env_data = b'\0'.join(new_env_list) + b'\0\0'
          
          # --- 安全检查 2: 空间溢出检查 ---
          padding_len = (ENV_SIZE - 4) - len(new_env_data)
          if padding_len < 0:
              print(f'❌ 致命错误: 环境变量溢出! 超出 {abs(padding_len)} 字节。')
              sys.exit(1)
          
          final_payload = new_env_data + (b'\0' * padding_len)
          
          # 计算 CRC
          new_crc = zlib.crc32(final_payload) & 0xffffffff
          print(f'   CRC32 校验: {hex(new_crc)}')
          
          # 写入内存
          data[ENV_OFFSET : ENV_OFFSET+4] = struct.pack('<I', new_crc)
          data[ENV_OFFSET+4 : ENV_OFFSET+ENV_SIZE] = final_payload

          # --- 安全检查 3: 内核完整性终检 (The Final Guard) ---
          print('🛡️ 执行最终内核完整性扫描...')
          kernel_magic = data[KERNEL_OFFSET:KERNEL_OFFSET+4].hex()
          print(f'   内核头特征码: {kernel_magic}')
          
          # 允许 LZMA (5d000080) 或 uImage (27051956)
          if kernel_magic != '5d000080' and kernel_magic != '27051956':
              print(f'❌ 致命错误: 内核头已损坏！生成终止。')
              sys.exit(1)
          else:
              print('   ✅ 内核完好无损。')

          # 4. 保存文件
          with open(OUT_BIN, 'wb') as f:
              f.write(data)
          
          print(f'🎉 固件生成成功: {OUT_BIN}')
          
          # 传递文件名给下一步
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write(f'filename={OUT_BIN}\n')
          "

      - name: Upload Custom Firmware
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.run_script.outputs.filename }}
          path: catdrive_patch_*.bin
