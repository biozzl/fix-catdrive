name: CatDrive Identity Factory (Deep Clean)

on:
  workflow_dispatch:
    inputs:
      mac_address:
        description: '输入目标 MAC 地址 (例如 00:11:32:12:34:56)'
        required: true
        default: '00:11:32:XX:XX:XX'
      sn_number:
        description: '输入目标 SN 序列号 (自动大写)'
        required: false
        default: ''

jobs:
  inject-identity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Verify Base Firmware
        run: |
          if [ ! -f "hybrid_ultimate_fix_safe.bin" ]; then
            echo "❌ 错误: 仓库根目录下找不到底包 hybrid_ultimate_fix_safe.bin"
            exit 1
          fi

      - name: Run Injection Script
        id: run_script
        env:
          INPUT_MAC: ${{ github.event.inputs.mac_address }}
          INPUT_SN: ${{ github.event.inputs.sn_number }}
        run: |
          python3 -c "
          import struct
          import zlib
          import sys
          import os

          BASE_BIN = 'hybrid_ultimate_fix_safe.bin'
          mac_suffix = os.environ['INPUT_MAC'].replace(':', '')[-4:]
          OUT_BIN = f'catdrive_patch_{mac_suffix}.bin'
          
          # 标准 Env 区域
          ENV_OFFSET = 0xD0000
          ENV_SIZE = 0x5000

          # 隐藏 SN 的位置 (根据刚才的扫描结果)
          HIDDEN_SN_OFFSET = 0x7eb020
          HIDDEN_SN_LEN = len('SN=1910Q2N321313')

          # 获取输入并转大写
          target_mac = os.environ.get('INPUT_MAC', '').strip().upper()
          target_sn = os.environ.get('INPUT_SN', '').strip().upper()

          print(f'🏭 正在生产固件...')
          print(f'   底包: {BASE_BIN}')
          print(f'   目标 SN : {target_sn}')

          with open(BASE_BIN, 'rb') as f:
              data = bytearray(f.read())

          # --- 步骤 1: 处理隐藏的旧 SN ---
          # 我们把旧 SN 覆盖成空字符或注释掉，确保系统读不到它
          print(f'🧹 清理隐藏的旧 SN (Offset: {hex(HIDDEN_SN_OFFSET)})...')
          # 检查那个位置是不是真的是 SN (防止误伤)
          if data[HIDDEN_SN_OFFSET:HIDDEN_SN_OFFSET+3] == b'SN=':
              # 用 0x00 填充覆盖
              for i in range(HIDDEN_SN_LEN):
                  data[HIDDEN_SN_OFFSET + i] = 0
              print('   ✅ 已抹除旧 SN 痕迹。')
          else:
              print('   ⚠️ 未在该位置发现旧 SN，跳过清理。')

          # --- 步骤 2: 在标准位置注入新身份 ---
          raw_env = data[ENV_OFFSET+4 : ENV_OFFSET+ENV_SIZE]
          
          env_dict = {}
          current_str = b''
          for byte in raw_env:
              if byte == 0:
                  if not current_str: break
                  if b'=' in current_str:
                      k, v = current_str.split(b'=', 1)
                      env_dict[k] = v
                  current_str = b''
              else:
                  current_str += bytes([byte])

          env_dict[b'ethaddr'] = target_mac.encode('utf-8')
          
          if target_sn:
              env_dict[b'sn'] = target_sn.encode('utf-8')
              env_dict[b'serialnet'] = target_sn.encode('utf-8')

          new_env_list = []
          for k, v in env_dict.items():
              new_env_list.append(k + b'=' + v)
          
          new_env_data = b'\0'.join(new_env_list) + b'\0\0'
          
          padding_len = (ENV_SIZE - 4) - len(new_env_data)
          if padding_len < 0:
              print(f'❌ 错误: 环境变量溢出！')
              sys.exit(1)
          
          final_payload = new_env_data + (b'\0' * padding_len)
          new_crc = zlib.crc32(final_payload) & 0xffffffff
          
          data[ENV_OFFSET : ENV_OFFSET+4] = struct.pack('<I', new_crc)
          data[ENV_OFFSET+4 : ENV_OFFSET+ENV_SIZE] = final_payload

          with open(OUT_BIN, 'wb') as f:
              f.write(data)
          
          print(f'🎉 固件生成成功: {OUT_BIN}')
          
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write(f'filename={OUT_BIN}\n')
          "

      - name: Upload Custom Firmware
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.run_script.outputs.filename }}
          path: catdrive_patch_*.bin
